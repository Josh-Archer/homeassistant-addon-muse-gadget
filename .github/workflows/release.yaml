name: Release

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  auto-version-release:
    name: Auto Version & Release
    runs-on: uecb-shared
    timeout-minutes: 10
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0

      - name: Calculate Semantic Version & Bump Tag
        id: tag_action
        uses: mathieudutour/github-tag-action@a22cf08638b34d5badda920f9daf6e72c477b07b # v6.2
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          default_bump: patch
          release_branches: main

      - name: Update Home Assistant Add-on Version
        if: steps.tag_action.outputs.new_tag != ''
        shell: bash
        run: |
          set -euo pipefail
          NEW_VER="${{ steps.tag_action.outputs.new_version }}"
          echo "Updating muse-gadget/config.yaml version to ${NEW_VER}..."
          sed -i "s/^version: .*/version: \"${NEW_VER}\"/" muse-gadget/config.yaml
          grep '^version:' muse-gadget/config.yaml

      - name: Commit Version Bump Back to Git
        if: steps.tag_action.outputs.new_tag != ''
        uses: stefanzweifel/git-auto-commit-action@b863ae1933cb653a53c021fe36dbb774e1fb9403 # v5.2.0
        with:
          commit_message: "chore(release): bump version to ${{ steps.tag_action.outputs.new_tag }} [skip ci]"
          file_pattern: 'muse-gadget/config.yaml'

      - name: Create GitHub Release
        if: steps.tag_action.outputs.new_tag != ''
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          tag_name: ${{ steps.tag_action.outputs.new_tag }}
          name: ${{ steps.tag_action.outputs.new_tag }}
          body: ${{ steps.tag_action.outputs.changelog }}
